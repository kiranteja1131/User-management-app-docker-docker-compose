<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nova AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="logo">NOVA<span>.</span></div>

        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your intelligent workspace.</p>

        <div class="flash" id="message" style="display:none;"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button class="btn" type="submit">Sign In →</button>

        </form>

        <div class="auth-footer">
            New user? <a href="/register.html">Create an account</a>
        </div>

    </div>
</div>

<script src="/static/script.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const formData = new FormData(this);

    const response = await fetch("/api/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(Object.fromEntries(formData))
    });

    const result = await response.json();

    const message = document.getElementById("message");
    message.style.display = "block";
    message.textContent = result.message;

    if (response.ok) {
        window.location.href = "/dashboard.html";
    }
});
</script>

</body>
</html>
